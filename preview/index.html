<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Aurora · Vista interactiva</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font:14px Arial;color:#172b46}aside{position:fixed;inset:0 auto 0 0;width:210px;background:#102c4b;color:white;padding:30px 18px}aside h2{font-size:19px;margin-bottom:45px}button{cursor:pointer;background:white;border:1px solid #dce4ed;border-radius:7px;padding:10px 14px;color:#244568}aside button{display:block;width:100%;text-align:left;background:none;color:#ccdaeb;border:0;margin:10px 0}aside button:hover,aside button.on{background:#235786;color:white}main{margin-left:210px;padding:32px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:8px 0}h2{font-size:18px}small,p{color:#74869d}header small{color:#238360}.toolbar{display:flex;gap:8px;margin:25px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.kpis article,.panel{background:white;border:1px solid #dfe7f0;border-radius:10px;padding:20px;margin-bottom:20px}.kpis strong{display:block;font-size:30px;margin:10px 0}.insights{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.chart{height:155px;display:flex;align-items:end;gap:15px;border-bottom:1px solid #e0e8f0}.chart div{flex:1;background:linear-gradient(#85b9fc,#3b82df);border-radius:4px 4px 0 0}.area{background:white;border:1px solid #dfe7f0;border-radius:10px;margin-bottom:20px;overflow:hidden}.area h2{background:#edf2f7;margin:0;padding:15px}.area h2 span{font-size:12px;font-weight:400;margin-left:15px}.cards{display:flex;gap:10px;padding:12px}.card{flex:1;min-width:0;text-align:center;padding:14px}.card b,.card small{display:block;margin-bottom:10px}.card strong{font-size:20px}.pill{display:inline-block;font-size:10px;border-radius:4px;padding:5px;margin:8px 0}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:11px;color:#6c7f97}.modal{position:fixed;inset:0;background:#102c4b80;display:grid;place-items:center}.dialog{background:white;padding:30px;border-radius:15px;width:500px;max-width:90vw}.actions{display:flex;gap:8px;flex-wrap:wrap}label{display:block;margin:15px 0}input,select,textarea{display:block;padding:10px;border:1px solid #cedae6;border-radius:5px;width:100%;margin-top:6px}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #e6edf5}.notice{background:#e8f1ff;padding:10px;border-radius:7px;font-size:12px;color:#315e92;margin-top:20px}@media(max-width:900px){aside{width:150px}main{margin-left:150px;padding:15px}.cards{flex-wrap:wrap}.card{min-width:140px}.kpis{grid-template-columns:1fr 1fr}.insights{grid-template-columns:1fr}}@media(max-width:500px){aside{position:static;width:100%;padding:12px}aside h2{margin:8px}aside button{display:inline-block;width:auto;margin:0}main{margin:0}header{display:block}}

body.menu-hidden aside{display:none}body.menu-hidden main{margin-left:0}.menu-toggle{margin-bottom:18px;min-height:44px}.toolbar{flex-wrap:wrap}
aside .menu-toggle{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:0 auto 20px;padding:0;font-size:22px;color:white;border:1px solid #ffffff30}main .menu-toggle{width:44px;height:44px;padding:0;font-size:22px}.menu-toggle:focus-visible{outline:3px solid #63b4ff;outline-offset:3px}

@keyframes servicePulse{0%,100%{filter:brightness(1);box-shadow:inset 0 0 0 2px #b76a00}50%{filter:brightness(.8);box-shadow:inset 0 0 0 3px #b76a00}}
.service-alert{animation:servicePulse 2s ease-in-out infinite}.service-label{color:#865100!important;font-weight:bold}.request-panel{max-width:800px}.request-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.send-request{background:#205e99;color:white;min-height:44px}.request-panel textarea{resize:vertical}.dialog{max-height:90vh;overflow:auto}
@media(prefers-reduced-motion:reduce){.service-alert{animation:none;background:#ffe3a6;box-shadow:inset 0 0 0 3px #d77c00}}
@media(max-width:600px){.request-grid{grid-template-columns:1fr}}
</style><aside id="sidebar"><button id="menu-close" class="menu-toggle" aria-controls="sidebar" aria-expanded="true" aria-label="Ocultar menú" title="Ocultar menú" onclick="toggleMenu()"><span aria-hidden="true">☰</span></button><h2>◈ LA AURORA</h2><nav></nav><p style="color:#9db3cb;font-size:12px">Vista interactiva local<br>Datos de demostración</p></aside><main></main><div id="modal"></div><script>
// Shift boundaries use Dominican local time, regardless of device timezone.
function currentShift(date = new Date()) {
  const hour = Number(new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Santo_Domingo', hour: '2-digit', hourCycle: 'h23',
  }).format(date));
  return hour >= 6 && hour < 15 ? '1' : hour >= 15 && hour < 23 ? '2' : '3';
}


const states=['Produciendo','Detenida','Correctivo','Operacional','Calidad','Electrónica','Cambio','Fuera de servicio','Sin comunicación'],colors=['#17ae61','#73859a','#ef4264','#f49418','#b29b00','#9255df','#0ba8b5','#728196','#36485e'];let menuHidden=false;let tab=location.hash==='#solicitar-servicio'?'Solicitar servicio':'Resumen',area='Todas',selected=null;const initial=()=>({machines:['GD','PROTOS','FM'].flatMap(a=>Array.from({length:a==='GD'?6:5},(_,i)=>({id:a==='FM'?'FM'+(i+1):a+'-0'+(i+1),area:a,product:['King Size','Box','Slim','Mentol','Capsule'][i%5],count:4000+i*210,state:i===1?'Operacional':i===3?'Detenida':'Produciendo'}))),services:[],events:[],shift:'A'});let d;try{d=JSON.parse(localStorage.getItem('aurora-preview'))||initial()}catch{d=initial()}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const f=n=>n.toLocaleString('es-DO');function save(){try{localStorage.setItem('aurora-preview',JSON.stringify(d))}catch{}render()}function toggleMenu(){menuHidden=!menuHidden;document.body.classList.toggle('menu-hidden',menuHidden);render();document.getElementById(menuHidden?'menu-open':'menu-close').focus()}function nav(t){tab=t;history.replaceState(null,'',t==='Solicitar servicio'?'#solicitar-servicio':location.pathname);render()}function filter(a){area=a;render()}function render(){document.querySelector('nav').innerHTML=['Resumen','Áreas','Máquinas','Solicitar servicio','Servicios','Reportes','Administración'].map(t=>`<button class="${tab===t?'on':''}" onclick="nav('${t}')">${t}</button>`).join('');const ms=d.machines.filter(m=>area==='Todas'||m.area===area);document.querySelector('main').innerHTML=`${menuHidden?'<button id="menu-open" class="menu-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Mostrar menú" title="Mostrar menú" onclick="toggleMenu()"><span aria-hidden="true">☰</span></button>':''}<header><div><small>LA AURORA / ${tab.toUpperCase()}</small><h1>${tab==='Resumen'?'Monitoreo de producción':tab}</h1></div><small><span id="current-shift">Turno ${currentShift()}</span><br><span id="dominican-clock"></span></small></header><div class="toolbar">${['Todas','GD','PROTOS','FM'].map(a=>`<button onclick="filter('${a}')">${a==='Todas'?'Toda la planta':a}</button>`).join('')}<button onclick="simulate()">▶ Simular producción</button></div><div class="kpis">${[['Producción del turno',f(ms.reduce((n,m)=>n+m.count,0))],['Máquinas activas',ms.filter(m=>m.state==='Produciendo').length],['Detenidas',ms.filter(m=>m.state!=='Produciendo').length],['Servicios pendientes',d.services.filter(s=>!['Resuelta','Cerrada','Cancelada'].includes(s.status)).length]].map(([a,b])=>`<article><small>${a}</small><strong>${b}</strong><small>Datos de demostración</small></article>`).join('')}</div>`+(tab==='Resumen'?`<div class="insights"><section class="panel"><h2>Producción por hora</h2><div class="chart">${[45,58,62,78,83,95,110,90,80,100,120,95].map(h=>`<div style="height:${h}px"></div>`).join('')}</div><p>06:00 ─────────────────────── 18:00 · ejemplo visual</p></section><section class="panel"><h2>Eventos recientes</h2>${d.events.slice(0,5).map(e=>`<p>${esc(e)}</p>`).join('')||'<p>Selecciona una máquina para registrar un evento.</p>'}</section></div>`:'')+(['Resumen','Áreas','Máquinas'].includes(tab)?['GD','PROTOS','FM'].filter(a=>area==='Todas'||area===a).map(a=>`<section class="area"><h2>${a}${a==='FM'?'<span>Filter Maker</span>':''}</h2><div class="cards">${ms.filter(m=>m.area===a).map(m=>`<button class="card ${hasService(m.id)?'service-alert':''}" style="background-color:${m.state==='Produciendo'?'#bdeccc':colors[states.indexOf(m.state)]+'30'};border-color:${colors[states.indexOf(m.state)]}" onclick="detail('${m.id}')"><b>● ${m.id} ${d.services.some(s=>s.machine===m.id&&!['Resuelta','Cerrada','Cancelada'].includes(s.status))?'⚒':''}</b><small>${esc(m.product)}</small><strong>${f(m.count)}</strong><br><span class="pill" style="background:${colors[states.indexOf(m.state)]}20;color:${colors[states.indexOf(m.state)]}">${m.state}</span>${hasService(m.id)?'<small class="service-label">⚒ Servicio pendiente</small>':''}</button>`).join('')}</div></section>`).join(''):tab==='Solicitar servicio'?serviceForm():tab==='Servicios'?`<section class="panel"><h2>Solicitudes de servicio</h2><button onclick="nav('Solicitar servicio')">＋ Nueva solicitud</button>${d.services.map((s,i)=>`<p><b>${s.machine} · ${s.status}</b> — ${esc(s.description)} <button onclick="resolveService(${i})">Marcar resuelta</button></p>`).join('')||'<p>Selecciona una máquina y pulsa Solicitar servicio.</p>'}</section>`:tab==='Reportes'?`<section class="panel"><h2>Producción por máquina</h2><button onclick="download()">Descargar CSV de demostración</button><table><tr><th>Máquina</th><th>Área</th><th>Producto</th><th>Producción</th></tr>${ms.map(m=>`<tr><td>${m.id}</td><td>${m.area}</td><td>${esc(m.product)}</td><td>${f(m.count)}</td></tr>`).join('')}</table></section>`:`<section class="panel"><h2>Configuración de demostración</h2><p>Selecciona cualquier máquina para cambiar su estado y registrar producción.</p><p><b>Turnos automáticos · República Dominicana</b><br>Turno 1: 6:00 a. m. – 3:00 p. m.<br>Turno 2: 3:00 p. m. – 11:00 p. m.<br>Turno 3: 11:00 p. m. – 6:00 a. m.</p><button onclick="if(confirm('¿Restablecer solamente los datos de esta vista local?')){d=initial();save()}">Restablecer demostración</button></section>`)+`<div class="legend">${states.map((s,i)=>`<span style="color:${colors[i]}">● ${s}</span>`).join('')}</div><p class="notice">Vista local para revisar el diseño e interacciones. Los cambios se guardan únicamente en este navegador. La aplicación completa del paquete usa servidor, sesiones y base de datos; esta vista no sustituye sus funciones ni sus permisos.</p>`}
function detail(id){selected=id;const m=d.machines.find(m=>m.id===id);document.getElementById('modal').innerHTML=`<div class="modal"><section class="dialog"><button style="float:right" onclick="closeModal()">×</button><h2>${m.id}</h2><p>${m.area} · ${esc(m.product)}</p><h1>${f(m.count)} unidades</h1><label>Estado<select onchange="changeState(this.value)">${states.map(s=>`<option ${m.state===s?'selected':''}>${s}</option>`).join('')}</select></label><div class="actions"><button onclick="addProduction()">Registrar producción</button><button onclick="service()">Solicitar servicio</button></div></section></div>`}function closeModal(){document.getElementById('modal').innerHTML=''}function changeState(s){d.machines.find(m=>m.id===selected).state=s;d.events.unshift(selected+': '+s);save()}function addProduction(){const q=Number(prompt('Unidades adicionales'));if(Number.isInteger(q)&&q>0){d.machines.find(m=>m.id===selected).count+=q;d.events.unshift(selected+': +'+q+' unidades');save();detail(selected)}}function service(){closeModal();nav('Solicitar servicio');const m=d.machines.find(m=>m.id===selected);if(m){document.getElementById('request-area').value=m.area;requestMachines();document.getElementById('request-machine').value=m.id}}function resolveService(i){d.services[i].status='Resuelta';save()}function simulate(){d.machines.filter(m=>m.state==='Produciendo').forEach(m=>m.count+=Math.round(50+Math.random()*100));d.events.unshift('Producción simulada actualizada');save()}function download(){const csv='Máquina,Área,Producto,Producción\n'+d.machines.map(m=>[m.id,m.area,m.product,m.count].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='produccion-demo.csv';a.click();URL.revokeObjectURL(a.href)};

function hasService(id){return d.services.some(s=>s.machine===id&&!['Resuelta','Cerrada','Cancelada'].includes(s.status))}
function serviceForm(){return `<section class="panel request-panel"><h2>Solicitar asistencia</h2><p>Selecciona el equipo y describe lo que necesitas. Su tarjeta avisará al equipo de mantenimiento.</p><form onsubmit="submitService(event)"><div class="request-grid"><label>Área<select id="request-area" name="area" onchange="requestMachines()">${['GD','PROTOS','FM'].map(a=>`<option>${a}</option>`).join('')}</select></label><label>Máquina<select id="request-machine" name="machine" required>${d.machines.filter(m=>m.area==='GD').map(m=>`<option>${esc(m.id)}</option>`).join('')}</select></label><label>Especialidad<select name="specialty"><option>Mecánica</option><option>Eléctrica</option><option>Electrónica</option><option>Automatización</option><option>Operacional</option><option>Otra</option></select></label><label>Prioridad<select name="priority"><option>Media</option><option>Baja</option><option>Alta</option><option>Crítica</option></select></label></div><label>Solicitante<input name="requester" required maxlength="80" placeholder="Tu nombre"></label><label>Descripción<textarea name="description" required maxlength="1000" rows="4" placeholder="Describe el problema o la asistencia necesaria"></textarea></label><button class="send-request" type="submit">Enviar solicitud</button><p id="request-error" role="alert"></p></form></section>`}
function requestMachines(){const area=document.getElementById('request-area').value;document.getElementById('request-machine').innerHTML=d.machines.filter(m=>m.area===area).map(m=>`<option>${esc(m.id)}</option>`).join('')}
function submitService(event){event.preventDefault();const values=Object.fromEntries(new FormData(event.target));const m=d.machines.find(m=>m.id===values.machine&&m.area===values.area);if(!m||!values.description.trim()||!values.requester.trim())return;d.services.unshift({...values,id:crypto.randomUUID(),description:values.description.trim(),status:'Pendiente',created:new Date().toISOString()});d.events.unshift(m.id+': servicio solicitado');try{localStorage.setItem('aurora-preview',JSON.stringify(d))}catch{d.services.shift();d.events.shift();document.getElementById('request-error').textContent='No se pudo guardar. Revisa el almacenamiento del navegador e intenta otra vez.';return}area=m.area;nav('Resumen')}
window.addEventListener('storage',event=>{if(event.key==='aurora-preview'&&event.newValue){try{const value=JSON.parse(event.newValue);if(!Array.isArray(value.machines)||!Array.isArray(value.services))return;d=value;if(tab!=='Solicitar servicio')render()}catch{}}});
render();


function updateClock(){
 const date=new Date();
 const shift=document.getElementById('current-shift');
 const clock=document.getElementById('dominican-clock');
 if(shift)shift.textContent='Turno '+currentShift(date);
 if(clock)clock.textContent=date.toLocaleTimeString('es-DO',{timeZone:'America/Santo_Domingo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})+' · República Dominicana';
}
updateClock();setInterval(updateClock,1000);
document.addEventListener('visibilitychange',updateClock);
</script></html>
